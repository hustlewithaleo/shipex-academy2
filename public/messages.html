<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages — Shipex</title>
  <meta name="description" content="Direct message other members of the academy.">
  <meta property="og:title" content="Messages — Shipex">
  <meta property="og:description" content="Direct message other members of the academy.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://shipex.academy/shipexban.png">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://shipex.academy/shipexban.png">
  <meta name="theme-color" content="#FF4211">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Host+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #0a0a0a;
  --surface: #121212;
  --surface-2: #171717;
  --text: #ffffff;
  --muted: #8a8a8a;
  --muted-2: #a9a9a9;
  --border-soft: rgba(255, 255, 255, 0.07);
  --accent: #FF4211;
  --accent-dim: rgba(255, 179, 156, 0.18);
  --radius: 18px;
  --font-head: 'Host Grotesk', -apple-system, system-ui, sans-serif;
  --font-body: 'DM Sans', -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); min-height: 100vh;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 40px 24px 40px; display: flex; flex-direction: column; height: 100vh; }
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex: 0 0 auto; }
.head a { color: var(--muted); text-decoration: none; font-size: 14px; }
.head a:hover { color: #fff; }
h1 { font-family: var(--font-head); font-size: 28px; letter-spacing: -0.02em; margin: 0 0 6px; }
.sub { color: var(--muted-2); font-size: 14px; margin: 0; }

.layout { flex: 1 1 auto; min-height: 0; display: flex; gap: 16px; }

.convos {
  flex: 0 0 280px; background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden;
}
.convos__search { flex: 0 0 auto; padding: 12px; border-bottom: 1px solid var(--border-soft); position: relative; }
.convos__search input {
  width: 100%; padding: 10px 12px; border-radius: 10px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border-soft);
  color: #fff; font-size: 13.5px; font-family: var(--font-body);
}
.convos__search input:focus { outline: none; border-color: var(--accent-dim); }
.search-results {
  position: absolute; left: 12px; right: 12px; top: 52px; z-index: 5;
  background: var(--surface-2); border: 1px solid var(--border-soft);
  border-radius: 10px; overflow: hidden; display: none; max-height: 240px; overflow-y: auto;
}
.search-results.open { display: block; }
.search-result {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; font-size: 13px;
}
.search-result:hover { background: rgba(255,255,255,0.05); }
.search-empty { padding: 10px; font-size: 12px; color: var(--muted); }

.convo-list { flex: 1 1 auto; overflow-y: auto; padding: 8px; }
.convo-btn {
  width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 9px 10px; border-radius: 10px; border: 0; background: none; cursor: pointer;
  color: var(--muted-2); margin-bottom: 2px;
}
.convo-btn:hover { background: rgba(255,255,255,0.04); }
.convo-btn.active { background: var(--accent-dim); }
.convo-btn__body { min-width: 0; flex: 1 1 auto; }
.convo-btn__name { font-size: 13.5px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
.convo-btn__name.vip { color: var(--accent); }
.convo-btn__preview { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.convo-btn__unread {
  flex: 0 0 auto; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
  border-radius: 999px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; padding: 0 5px;
}
.empty { color: var(--muted); font-size: 14px; padding: 30px 14px; text-align: center; }

.avatar {
  width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto;
  background: var(--surface-2); border: 1px solid var(--border-soft);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head); font-size: 13px; font-weight: 700; color: var(--muted-2);
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }

.box {
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius); display: flex; flex-direction: column;
  flex: 1 1 auto; min-height: 0; overflow: hidden;
}
.box__head { flex: 0 0 auto; padding: 14px 18px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; gap: 10px; }
.box__head-name { font-family: var(--font-head); font-size: 15px; letter-spacing: -0.01em; }
.box__head-name.vip { color: var(--accent); }
.box__placeholder { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }

.thread { flex: 1 1 auto; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.bubble-row { display: flex; }
.bubble-row.mine { justify-content: flex-end; }
.bubble {
  max-width: 70%; padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.4;
  word-wrap: break-word; white-space: pre-wrap; background: var(--surface-2); color: var(--muted-2);
}
.bubble-row.mine .bubble { background: var(--accent); color: #fff; }
.bubble-time { font-size: 10px; color: var(--muted); margin-top: 3px; }
.bubble-row.mine .bubble-time { text-align: right; }

.composer { flex: 0 0 auto; display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--border-soft); }
.composer input {
  flex: 1; min-width: 0; padding: 11px 13px; border-radius: 10px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border-soft);
  color: #fff; font-size: 14px; font-family: var(--font-body);
}
.composer input:focus { outline: none; border-color: var(--accent-dim); }
.composer .btn {
  padding: 11px 18px; border-radius: 10px; border: 0; cursor: pointer;
  font-family: var(--font-body); font-size: 14px; font-weight: 600;
  background: var(--accent); color: #fff; transition: opacity .15s; white-space: nowrap;
}
.composer .btn:hover { opacity: 0.9; }
.composer .btn:disabled { opacity: 0.5; cursor: default; }
.composer-msg { font-size: 12px; color: var(--muted); padding: 0 14px 10px; min-height: 14px; }
.composer-msg.error { color: #ff6b5c; }

.gate { display: flex; align-items: center; justify-content: center; min-height: 60vh; text-align: center; }
.gate p { color: var(--muted-2); font-size: 15px; }

@media (max-width: 680px) {
  .layout { flex-direction: column; }
  .convos { flex: 0 0 auto; max-height: 40vh; }
}
  </style>
</head>
<body>
  <div class="wrap" id="app" style="display:none;">
    <div class="head">
      <div>
        <h1>Messages</h1>
        <p class="sub">Direct message other members of the academy.</p>
      </div>
      <a href="/library">&larr; Back to library</a>
    </div>

    <div class="layout">
      <div class="convos">
        <div class="convos__search">
          <input type="text" id="dmSearch" placeholder="Search a member to message…" autocomplete="off">
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="convo-list" id="convoList"></div>
      </div>
      <div class="box">
        <div class="box__head" id="boxHead" style="display:none;">
          <div class="avatar" id="boxAvatar"></div>
          <div class="box__head-name" id="boxName"></div>
        </div>
        <div class="box__placeholder" id="boxPlaceholder">Pick a conversation, or search for someone to message.</div>
        <div class="thread" id="thread" style="display:none;"></div>
        <div class="composer-msg" id="composerMsg"></div>
        <div class="composer" id="composer" style="display:none;">
          <input type="text" id="dmInput" placeholder="Message…" maxlength="500" autocomplete="off">
          <button class="btn" id="dmSendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <div class="gate" id="gate" style="display:none;">
    <p id="gateMsg">Checking access…</p>
  </div>

  <script>
    function fetchJson(url, opts) {
      return fetch(url, Object.assign({ credentials: "same-origin" }, opts || {}))
        .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); });
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function initials(name) { return String(name || "?").trim().slice(0, 1).toUpperCase(); }
    function avatarHtml(user) {
      return user.avatar ? '<img src="' + escapeHtml(user.avatar) + '" alt="">' : initials(user.displayName);
    }
    function fmtTime(ms) {
      var diff = Date.now() - ms;
      if (diff < 60000) return "just now";
      if (diff < 3600000) return Math.floor(diff / 60000) + "m ago";
      if (diff < 86400000) return Math.floor(diff / 3600000) + "h ago";
      var d = new Date(ms);
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    var meId = null;
    var conversations = [];
    var activeUser = null; // { id, username, displayName, avatar, vip }
    var lastRenderedId = null;

    function renderConvoList() {
      var wrap = document.getElementById("convoList");
      if (!conversations.length) {
        wrap.innerHTML = '<div class="empty">No conversations yet — search for someone above.</div>';
        return;
      }
      wrap.innerHTML = "";
      conversations.forEach(function (c) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "convo-btn" + (activeUser && activeUser.id === c.otherUser.id ? " active" : "");
        btn.innerHTML =
          '<div class="avatar">' + avatarHtml(c.otherUser) + '</div>' +
          '<div class="convo-btn__body">' +
            '<div class="convo-btn__name' + (c.otherUser.vip ? ' vip' : '') + '">' + escapeHtml(c.otherUser.displayName) + '</div>' +
            '<div class="convo-btn__preview">' + escapeHtml(c.lastMessage.text) + '</div>' +
          '</div>' +
          (c.unreadCount ? '<div class="convo-btn__unread">' + c.unreadCount + '</div>' : '');
        btn.addEventListener("click", function () { openConversation(c.otherUser); });
        wrap.appendChild(btn);
      });
    }

    function loadConversations(cb) {
      fetchJson("/api/dm/conversations").then(function (res) {
        if (res.ok) {
          conversations = res.data.conversations || [];
          renderConvoList();
        }
        if (cb) cb();
      });
    }

    function renderThread(messages) {
      var newestId = messages.length ? messages[messages.length - 1].id : null;
      if (newestId === lastRenderedId) return;
      lastRenderedId = newestId;
      var el = document.getElementById("thread");
      var wasAtBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 40;
      if (!messages.length) {
        el.innerHTML = '<div class="empty">No messages yet — say hi.</div>';
        return;
      }
      el.innerHTML = messages.map(function (m) {
        var mine = m.from === meId;
        return (
          '<div class="bubble-row' + (mine ? ' mine' : '') + '">' +
            '<div>' +
              '<div class="bubble">' + escapeHtml(m.text) + '</div>' +
              '<div class="bubble-time">' + fmtTime(m.at) + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join("");
      el.scrollTop = el.scrollHeight;
    }

    function loadThread() {
      if (!activeUser) return;
      fetchJson("/api/dm/" + activeUser.id + "/messages").then(function (res) {
        if (res.ok && activeUser) renderThread(res.data.messages || []);
      });
    }

    function openConversation(user) {
      activeUser = user;
      lastRenderedId = null;
      document.getElementById("boxHead").style.display = "flex";
      document.getElementById("boxAvatar").innerHTML = avatarHtml(user);
      var nameEl = document.getElementById("boxName");
      nameEl.textContent = user.displayName;
      nameEl.className = "box__head-name" + (user.vip ? " vip" : "");
      document.getElementById("boxPlaceholder").style.display = "none";
      document.getElementById("thread").style.display = "flex";
      document.getElementById("composer").style.display = "flex";
      document.getElementById("thread").innerHTML = "";
      document.getElementById("searchResults").classList.remove("open");
      document.getElementById("dmSearch").value = "";
      renderConvoList();
      loadThread();
      // mark this conversation read locally right away so the badge clears instantly
      conversations.forEach(function (c) { if (c.otherUser.id === user.id) c.unreadCount = 0; });
      renderConvoList();
    }

    var searchTimer = null;
    document.getElementById("dmSearch").addEventListener("input", function (e) {
      var q = e.target.value.trim();
      clearTimeout(searchTimer);
      var resultsEl = document.getElementById("searchResults");
      if (!q) { resultsEl.classList.remove("open"); return; }
      searchTimer = setTimeout(function () {
        fetchJson("/api/dm/search?q=" + encodeURIComponent(q)).then(function (res) {
          if (!res.ok) return;
          var users = res.data.users || [];
          resultsEl.innerHTML = users.length
            ? users.map(function (u) {
                return '<div class="search-result" data-id="' + u.id + '">' +
                  '<div class="avatar">' + avatarHtml(u) + '</div>' +
                  '<span' + (u.vip ? ' style="color:var(--accent);font-weight:700;"' : '') + '>' + escapeHtml(u.displayName) + '</span>' +
                '</div>';
              }).join("")
            : '<div class="search-empty">No members found.</div>';
          Array.prototype.forEach.call(resultsEl.querySelectorAll(".search-result"), function (row) {
            var u = users.filter(function (x) { return x.id === row.dataset.id; })[0];
            row.addEventListener("click", function () { if (u) openConversation(u); });
          });
          resultsEl.classList.add("open");
        });
      }, 250);
    });
    document.addEventListener("click", function (e) {
      var wrap = document.querySelector(".convos__search");
      if (wrap && !wrap.contains(e.target)) document.getElementById("searchResults").classList.remove("open");
    });

    var dmInput = document.getElementById("dmInput");
    var dmSendBtn = document.getElementById("dmSendBtn");
    var composerMsg = document.getElementById("composerMsg");
    function sendDm() {
      if (!activeUser) return;
      var text = dmInput.value.trim();
      if (!text) return;
      dmSendBtn.disabled = true;
      composerMsg.className = "composer-msg";
      composerMsg.textContent = "";
      fetchJson("/api/dm/" + activeUser.id + "/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text }),
      }).then(function (res) {
        dmSendBtn.disabled = false;
        if (res.ok) {
          dmInput.value = "";
          lastRenderedId = null;
          loadThread();
          loadConversations();
        } else if (res.data && res.data.error === "too_fast") {
          composerMsg.className = "composer-msg error";
          composerMsg.textContent = "Slow down a bit — try again in a moment.";
        } else {
          composerMsg.className = "composer-msg error";
          composerMsg.textContent = "Something went wrong — try again.";
        }
      });
    }
    dmSendBtn.addEventListener("click", sendDm);
    dmInput.addEventListener("keydown", function (e) { if (e.key === "Enter") sendDm(); });

    fetch("/api/me", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (user) {
        if (!user) { location.href = "/login"; return; }
        meId = user.id;
        document.getElementById("app").style.display = "flex";
        loadConversations(function () {
          var wantedId = new URLSearchParams(location.search).get("u");
          if (wantedId) {
            var existing = conversations.filter(function (c) { return c.otherUser.id === wantedId; })[0];
            if (existing) {
              openConversation(existing.otherUser);
            } else {
              fetchJson("/api/dm/search?q=" + encodeURIComponent(wantedId)).then(function (res) {
                var match = res.ok && (res.data.users || []).filter(function (u) { return u.id === wantedId; })[0];
                if (match) openConversation(match);
              });
            }
          }
        });
        setInterval(function () {
          loadConversations();
          loadThread();
        }, 4000);
      })
      .catch(function () {
        document.getElementById("gate").style.display = "flex";
        document.getElementById("gateMsg").textContent = "Something went wrong — try refreshing.";
      });
  </script>
</body>
</html>
