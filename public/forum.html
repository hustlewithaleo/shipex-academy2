<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forum — Shipex</title>
  <meta name="description" content="Announcements, chat, course requests, and suggestions for the academy.">
  <meta property="og:title" content="Forum — Shipex">
  <meta property="og:description" content="Announcements, chat, course requests, and suggestions for the academy.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://shipex.academy/shipexban.png">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://shipex.academy/shipexban.png">
  <meta name="theme-color" content="#FF4211">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Host+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #0a0a0a;
  --surface: #121212;
  --surface-2: #171717;
  --text: #ffffff;
  --muted: #8a8a8a;
  --muted-2: #a9a9a9;
  --border-soft: rgba(255, 255, 255, 0.07);
  --accent: #FF4211;
  --accent-dim: rgba(255, 179, 156, 0.18);
  --radius: 18px;
  --font-head: 'Host Grotesk', -apple-system, system-ui, sans-serif;
  --font-body: 'DM Sans', -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); min-height: 100vh;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 40px 24px 40px; display: flex; flex-direction: column; height: 100vh; }
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex: 0 0 auto; }
.head a { color: var(--muted); text-decoration: none; font-size: 14px; }
.head a:hover { color: #fff; }
h1 { font-family: var(--font-head); font-size: 28px; letter-spacing: -0.02em; margin: 0 0 6px; }
.sub { color: var(--muted-2); font-size: 14px; margin: 0; }

.layout { flex: 1 1 auto; min-height: 0; display: flex; gap: 16px; }

.channels {
  flex: 0 0 220px; background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius); padding: 10px; overflow-y: auto;
}
.channel-btn {
  width: 100%; display: flex; align-items: center; gap: 8px; text-align: left;
  padding: 9px 10px; border-radius: 10px; border: 0; background: none; cursor: pointer;
  color: var(--muted-2); font-family: var(--font-body); font-size: 13.5px;
}
.channel-btn:hover { background: rgba(255,255,255,0.04); color: #fff; }
.channel-btn.active { background: var(--accent-dim); color: #fff; }
.channel-btn__hash { flex: 0 0 auto; color: var(--muted); font-size: 13px; }
.channel-btn__emoji { flex: 0 0 auto; }
.channel-btn__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.box {
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius); display: flex; flex-direction: column;
  flex: 1 1 auto; min-height: 0; overflow: hidden;
}
.box__head {
  flex: 0 0 auto; padding: 14px 18px; border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; gap: 8px;
}
.box__head-emoji { font-size: 16px; }
.box__head-title { font-family: var(--font-head); font-size: 15px; letter-spacing: -0.01em; }

.messages {
  flex: 1 1 auto; overflow-y: auto; padding: 20px; display: flex;
  flex-direction: column; gap: 14px;
}
.msg-row { display: flex; gap: 10px; align-items: flex-start; }
.msg-row__avatar {
  width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto;
  background: var(--surface-2); border: 1px solid var(--border-soft);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head); font-size: 13px; font-weight: 700; color: var(--muted-2);
  overflow: hidden;
}
.msg-row__avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg-row__body { min-width: 0; }
.msg-row__head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; flex-wrap: wrap; }
.msg-row__name { font-size: 13px; font-weight: 700; color: #fff; }
.msg-row__name.vip { color: var(--accent); }
.msg-row__tag {
  font-size: 10px; font-weight: 800; letter-spacing: 0.04em; color: var(--accent);
  background: rgba(255, 66, 17, 0.14); border: 1px solid rgba(255, 66, 17, 0.4);
  border-radius: 999px; padding: 1px 6px;
}
.msg-row__tag--admin { color: #22C55E; background: rgba(34, 197, 94, 0.14); border-color: rgba(34, 197, 94, 0.4); }
.msg-row__time { font-size: 11px; color: var(--muted); }
.msg-row__text { font-size: 14px; color: var(--muted-2); line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
.empty { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }

.composer {
  flex: 0 0 auto; display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--border-soft);
}
.composer input {
  flex: 1; min-width: 0; padding: 11px 13px; border-radius: 10px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border-soft);
  color: #fff; font-size: 14px; font-family: var(--font-body);
}
.composer input:focus { outline: none; border-color: var(--accent-dim); }
.composer input:disabled { opacity: 0.5; }
.composer .btn {
  padding: 11px 18px; border-radius: 10px; border: 0; cursor: pointer;
  font-family: var(--font-body); font-size: 14px; font-weight: 600;
  background: var(--accent); color: #fff; transition: opacity .15s; white-space: nowrap;
}
.composer .btn:hover { opacity: 0.9; }
.composer .btn:disabled { opacity: 0.5; cursor: default; }
.composer-msg { font-size: 12px; color: var(--muted); padding: 0 14px 10px; min-height: 14px; }
.composer-msg.error { color: #ff6b5c; }

.gate { display: flex; align-items: center; justify-content: center; min-height: 60vh; text-align: center; }
.gate p { color: var(--muted-2); font-size: 15px; }

@media (max-width: 680px) {
  .layout { flex-direction: column; }
  .channels { flex: 0 0 auto; display: flex; overflow-x: auto; gap: 6px; }
  .channel-btn { width: auto; flex: 0 0 auto; }
  .channel-btn__label { max-width: 140px; }
}
  </style>
</head>
<body>
  <div class="wrap" id="app" style="display:none;">
    <div class="head">
      <div>
        <h1>Forum</h1>
        <p class="sub">Announcements, chat, course requests, and suggestions.</p>
      </div>
      <a href="/library">&larr; Back to library</a>
    </div>

    <div class="layout">
      <div class="channels" id="channels"></div>
      <div class="box">
        <div class="box__head">
          <span class="box__head-emoji" id="channelEmoji"></span>
          <span class="box__head-title" id="channelTitle"></span>
        </div>
        <div class="messages" id="messages"></div>
        <div class="composer-msg" id="composerMsg"></div>
        <div class="composer">
          <input type="text" id="shoutInput" placeholder="Say something…" maxlength="300" autocomplete="off">
          <button class="btn" id="shoutBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <div class="gate" id="gate" style="display:none;">
    <p id="gateMsg">Checking access…</p>
  </div>

  <script>
    function fetchJson(url, opts) {
      return fetch(url, Object.assign({ credentials: "same-origin" }, opts || {}))
        .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); });
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function initials(name) {
      return String(name || "?").trim().slice(0, 1).toUpperCase();
    }
    function fmtTime(ms) {
      var diff = Date.now() - ms;
      if (diff < 60000) return "just now";
      if (diff < 3600000) return Math.floor(diff / 60000) + "m ago";
      if (diff < 86400000) return Math.floor(diff / 3600000) + "h ago";
      var d = new Date(ms);
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    var channels = [];
    var activeChannelId = null;
    var lastRenderedId = null;
    var shoutInput = document.getElementById("shoutInput");
    var shoutBtn = document.getElementById("shoutBtn");
    var composerMsg = document.getElementById("composerMsg");
    var messagesEl = document.getElementById("messages");

    function activeChannel() {
      return channels.filter(function (c) { return c.id === activeChannelId; })[0];
    }

    function renderChannelList() {
      var wrap = document.getElementById("channels");
      wrap.innerHTML = "";
      channels.forEach(function (c) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "channel-btn" + (c.id === activeChannelId ? " active" : "");
        btn.innerHTML =
          '<span class="channel-btn__hash">#</span>' +
          '<span class="channel-btn__emoji">' + c.icon + '</span>' +
          '<span class="channel-btn__label">' + escapeHtml(c.label) + '</span>';
        btn.addEventListener("click", function () { selectChannel(c.id); });
        wrap.appendChild(btn);
      });
    }

    function updateComposerForChannel() {
      var c = activeChannel();
      if (!c) return;
      if (c.canPost) {
        shoutInput.disabled = false;
        shoutBtn.disabled = false;
        shoutInput.placeholder = "Message #" + c.label + "…";
      } else {
        shoutInput.disabled = true;
        shoutBtn.disabled = true;
        shoutInput.placeholder = "Only admins can post here";
      }
      composerMsg.className = "composer-msg";
      composerMsg.textContent = "";
    }

    function renderMessages(messages) {
      var wasAtBottom = messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 40;
      var newestId = messages.length ? messages[messages.length - 1].id : null;
      var key = activeChannelId + ":" + newestId;
      if (key === lastRenderedId) return; // nothing new, don't re-render and steal scroll position
      lastRenderedId = key;

      if (!messages.length) {
        messagesEl.innerHTML = '<div class="empty">No messages yet — be the first.</div>';
        return;
      }
      messagesEl.innerHTML = messages.map(function (m) {
        var avatar = m.avatar
          ? '<img src="' + escapeHtml(m.avatar) + '" alt="">'
          : initials(m.displayName);
        var tags = "";
        if (m.admin) tags += '<span class="msg-row__tag msg-row__tag--admin">ADMIN</span>';
        else if (m.vip) tags += '<span class="msg-row__tag">VIP</span>';
        return (
          '<div class="msg-row">' +
            '<div class="msg-row__avatar">' + avatar + '</div>' +
            '<div class="msg-row__body">' +
              '<div class="msg-row__head">' +
                '<span class="msg-row__name' + (m.vip ? ' vip' : '') + '">' + escapeHtml(m.displayName) + '</span>' +
                tags +
                '<span class="msg-row__time">' + fmtTime(m.at) + '</span>' +
              '</div>' +
              '<div class="msg-row__text">' + escapeHtml(m.text) + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join("");
      if (wasAtBottom || key.split(":")[1] === "null") messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function loadMessages() {
      if (!activeChannelId) return;
      fetchJson("/api/forum/" + activeChannelId + "/messages").then(function (res) {
        if (res.ok && activeChannelId) renderMessages(res.data.messages || []);
      });
    }

    function selectChannel(channelId) {
      activeChannelId = channelId;
      lastRenderedId = null;
      var c = activeChannel();
      document.getElementById("channelEmoji").textContent = c ? c.icon : "";
      document.getElementById("channelTitle").textContent = c ? c.label : "";
      messagesEl.innerHTML = "";
      renderChannelList();
      updateComposerForChannel();
      loadMessages();
    }

    function sendShout() {
      var c = activeChannel();
      if (!c || !c.canPost) return;
      var text = shoutInput.value.trim();
      if (!text) return;
      shoutBtn.disabled = true;
      composerMsg.className = "composer-msg";
      composerMsg.textContent = "";
      fetchJson("/api/forum/" + activeChannelId + "/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text }),
      }).then(function (res) {
        shoutBtn.disabled = false;
        if (res.ok) {
          shoutInput.value = "";
          lastRenderedId = null; // force re-render even if this is the only change
          loadMessages();
        } else if (res.data && res.data.error === "too_fast") {
          composerMsg.className = "composer-msg error";
          composerMsg.textContent = "Slow down a bit — try again in a few seconds.";
        } else {
          composerMsg.className = "composer-msg error";
          composerMsg.textContent = "Something went wrong — try again.";
        }
      });
    }
    shoutBtn.addEventListener("click", sendShout);
    shoutInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") sendShout();
    });

    fetch("/api/me", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (user) {
        if (!user) { location.href = "/login"; return; }
        return fetchJson("/api/forum/channels");
      })
      .then(function (res) {
        if (!res || !res.ok) throw new Error("channels_failed");
        channels = res.data.channels || [];
        document.getElementById("app").style.display = "flex";
        var wanted = new URLSearchParams(location.search).get("c");
        var initial = channels.filter(function (c) { return c.id === wanted; })[0] || channels[0];
        if (initial) selectChannel(initial.id);
        setInterval(loadMessages, 4000);
      })
      .catch(function () {
        document.getElementById("gate").style.display = "flex";
        document.getElementById("gateMsg").textContent = "Something went wrong — try refreshing.";
      });
  </script>
</body>
</html>
