<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shoutbox — Shipex</title>
  <meta name="description" content="Say what's up to the rest of the academy.">
  <meta property="og:title" content="Shoutbox — Shipex">
  <meta property="og:description" content="Say what's up to the rest of the academy.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://shipex.academy/shipexban.png">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://shipex.academy/shipexban.png">
  <meta name="theme-color" content="#FF4211">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Host+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #0a0a0a;
  --surface: #121212;
  --surface-2: #171717;
  --text: #ffffff;
  --muted: #8a8a8a;
  --muted-2: #a9a9a9;
  --border-soft: rgba(255, 255, 255, 0.07);
  --accent: #FF4211;
  --accent-dim: rgba(255, 179, 156, 0.18);
  --radius: 18px;
  --font-head: 'Host Grotesk', -apple-system, system-ui, sans-serif;
  --font-body: 'DM Sans', -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); min-height: 100vh;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; display: flex; flex-direction: column; height: 100vh; }
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex: 0 0 auto; }
.head a { color: var(--muted); text-decoration: none; font-size: 14px; }
.head a:hover { color: #fff; }
h1 { font-family: var(--font-head); font-size: 28px; letter-spacing: -0.02em; margin: 0 0 6px; }
.sub { color: var(--muted-2); font-size: 14px; margin: 0; }

.box {
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius); display: flex; flex-direction: column;
  flex: 1 1 auto; min-height: 0; overflow: hidden;
}
.messages {
  flex: 1 1 auto; overflow-y: auto; padding: 20px; display: flex;
  flex-direction: column; gap: 14px;
}
.msg-row { display: flex; gap: 10px; align-items: flex-start; }
.msg-row__avatar {
  width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto;
  background: var(--surface-2); border: 1px solid var(--border-soft);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head); font-size: 13px; font-weight: 700; color: var(--muted-2);
  overflow: hidden;
}
.msg-row__avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg-row__body { min-width: 0; }
.msg-row__head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.msg-row__name { font-size: 13px; font-weight: 700; color: #fff; }
.msg-row__name.vip { color: var(--accent); }
.msg-row__vip-tag {
  font-size: 10px; font-weight: 800; letter-spacing: 0.04em; color: var(--accent);
  background: rgba(255, 66, 17, 0.14); border: 1px solid rgba(255, 66, 17, 0.4);
  border-radius: 999px; padding: 1px 6px;
}
.msg-row__time { font-size: 11px; color: var(--muted); }
.msg-row__text { font-size: 14px; color: var(--muted-2); line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
.empty { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }

.composer {
  flex: 0 0 auto; display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--border-soft);
}
.composer input {
  flex: 1; min-width: 0; padding: 11px 13px; border-radius: 10px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border-soft);
  color: #fff; font-size: 14px; font-family: var(--font-body);
}
.composer input:focus { outline: none; border-color: var(--accent-dim); }
.composer .btn {
  padding: 11px 18px; border-radius: 10px; border: 0; cursor: pointer;
  font-family: var(--font-body); font-size: 14px; font-weight: 600;
  background: var(--accent); color: #fff; transition: opacity .15s; white-space: nowrap;
}
.composer .btn:hover { opacity: 0.9; }
.composer .btn:disabled { opacity: 0.5; cursor: default; }
.composer-msg { font-size: 12px; color: var(--muted); padding: 0 14px 10px; min-height: 14px; }
.composer-msg.error { color: #ff6b5c; }

.gate { display: flex; align-items: center; justify-content: center; min-height: 60vh; text-align: center; }
.gate p { color: var(--muted-2); font-size: 15px; }
  </style>
</head>
<body>
  <div class="wrap" id="app" style="display:none;">
    <div class="head">
      <div>
        <h1>Shoutbox</h1>
        <p class="sub">Say what's up to the rest of the academy.</p>
      </div>
      <a href="/library">&larr; Back to library</a>
    </div>

    <div class="box">
      <div class="messages" id="messages"></div>
      <div class="composer-msg" id="composerMsg"></div>
      <div class="composer">
        <input type="text" id="shoutInput" placeholder="Say something…" maxlength="300" autocomplete="off">
        <button class="btn" id="shoutBtn">Send</button>
      </div>
    </div>
  </div>

  <div class="gate" id="gate" style="display:none;">
    <p id="gateMsg">Checking access…</p>
  </div>

  <script>
    function fetchJson(url, opts) {
      return fetch(url, Object.assign({ credentials: "same-origin" }, opts || {}))
        .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); });
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function initials(name) {
      return String(name || "?").trim().slice(0, 1).toUpperCase();
    }
    function fmtTime(ms) {
      var diff = Date.now() - ms;
      if (diff < 60000) return "just now";
      if (diff < 3600000) return Math.floor(diff / 60000) + "m ago";
      if (diff < 86400000) return Math.floor(diff / 3600000) + "h ago";
      var d = new Date(ms);
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    var messagesEl = document.getElementById("messages");
    var lastRenderedId = null;
    function renderMessages(messages) {
      var wasAtBottom = messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 40;
      var newestId = messages.length ? messages[messages.length - 1].id : null;
      if (newestId === lastRenderedId) return; // nothing new, don't re-render and steal scroll position
      lastRenderedId = newestId;

      if (!messages.length) {
        messagesEl.innerHTML = '<div class="empty">No shouts yet — be the first.</div>';
        return;
      }
      messagesEl.innerHTML = messages.map(function (m) {
        var avatar = m.avatar
          ? '<img src="' + escapeHtml(m.avatar) + '" alt="">'
          : initials(m.displayName);
        var vipTag = m.vip ? '<span class="msg-row__vip-tag">VIP</span>' : '';
        return (
          '<div class="msg-row">' +
            '<div class="msg-row__avatar">' + avatar + '</div>' +
            '<div class="msg-row__body">' +
              '<div class="msg-row__head">' +
                '<span class="msg-row__name' + (m.vip ? ' vip' : '') + '">' + escapeHtml(m.displayName) + '</span>' +
                vipTag +
                '<span class="msg-row__time">' + fmtTime(m.at) + '</span>' +
              '</div>' +
              '<div class="msg-row__text">' + escapeHtml(m.text) + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join("");
      if (wasAtBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function loadMessages() {
      fetchJson("/api/shoutbox").then(function (res) {
        if (res.ok) renderMessages(res.data.messages || []);
      });
    }

    var shoutInput = document.getElementById("shoutInput");
    var shoutBtn = document.getElementById("shoutBtn");
    var composerMsg = document.getElementById("composerMsg");
    function sendShout() {
      var text = shoutInput.value.trim();
      if (!text) return;
      shoutBtn.disabled = true;
      composerMsg.className = "composer-msg";
      composerMsg.textContent = "";
      fetchJson("/api/shoutbox", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text }),
      }).then(function (res) {
        shoutBtn.disabled = false;
        if (res.ok) {
          shoutInput.value = "";
          lastRenderedId = null; // force re-render even if this is the only change
          loadMessages();
        } else if (res.data && res.data.error === "too_fast") {
          composerMsg.className = "composer-msg error";
          composerMsg.textContent = "Slow down a bit — try again in a few seconds.";
        } else {
          composerMsg.className = "composer-msg error";
          composerMsg.textContent = "Something went wrong — try again.";
        }
      });
    }
    shoutBtn.addEventListener("click", sendShout);
    shoutInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") sendShout();
    });

    fetch("/api/me", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (user) {
        if (!user) { location.href = "/login"; return; }
        document.getElementById("app").style.display = "flex";
        loadMessages();
        setInterval(loadMessages, 4000);
      })
      .catch(function () {
        document.getElementById("gate").style.display = "flex";
        document.getElementById("gateMsg").textContent = "Something went wrong — try refreshing.";
      });
  </script>
</body>
</html>
